schema_version = "1.4"

artifacts = ["/app/controller.json"]

[task]
name = "afterquery/stiction-loop-retune"
description = "Retune an oscillating process loop from closed-loop historian data so that a simulated held-out test shows no sustained oscillation, good disturbance rejection, small offset and limited valve travel."
authors = [{ name = "Yvonne Awuor Ndolo", email = "ndolopj37@gmail.com" }]
keywords = ["control-loop-tuning", "system-identification", "valve-stiction", "instrumentation-and-control", "closed-loop-data"]

[metadata]
author_name = "Yvonne Awuor Ndolo"
author_email = "ndolopj37@gmail.com"
author_organization = "Independent Researcher"
author_profile = "https://www.linkedin.com/in/yvonne-awuor-7aa7b7395/"
conflicts_of_interest = "None"
domain = "engineering-sciences"
field = "electrical-engineering"
subfield = "process control and loop tuning"
category = "Science"
subcategory = "Electrical & Computer Engineering"
tags = ["control-loop-tuning", "pid", "valve-stiction", "system-identification", "closed-loop-identification", "instrumentation-and-control"]
expert_time_estimate_hours = 4
relevant_experience = "I studied Instrumentation and Control Engineering at Egerton University (BSc, 2019), including control systems, industrial instrumentation, power systems and automation. My practical work was in industrial controls: at United Millers I helped with controls and instrumentation on production machines, finding faults, working on PLC panels and motor connections, and maintaining reverse-osmosis plant control panels. At Kenya Power I worked in the Network Management Division on protection and recloser circuits, condition monitoring and SCADA-based system control. At Geothermal Development Company I supported maintenance of drilling-rig control and monitoring systems. Since 2021 I have done independent technical research and documentation work, reading technical material closely, catching inconsistencies and writing up findings."
difficulty_explanation = "The data are synthetic, made by a seeded generator I wrote and disclose here. It is a process with two lags and dead time, a gain that shifts with operating point, sensor noise, unmeasured load disturbances and a sticking valve, logged while an aggressive PI controller ran it. The log never says why the loop cycles. The obvious moves fail: a textbook tuning from a first-order-plus-dead-time fit still oscillates in 96 percent of the held-out runs, and simply detuning is too slow and still cycles. With only Kp and Ti you cannot both stop the stick-slip cycle and reject disturbances, so the answer needs an error dead-band. It has to be sized against the stick band and the sensor noise together: too small leaves a cycle or a chattering valve, too large leaves an offset and slow recovery. Fitting a model to closed-loop data is also tricky, because the unmeasured disturbances and the valve nonlinearity bias a naive fit. A fixed guess for the dead-band works on only some of my 32 test plants and fails on the shipped one."
solution_explanation = "I fit a static map from the setpoint plateaus, then fit two lags, the dead time and a stick-slip valve model by comparing simulated and logged PV, using the logged controller output as the input. I do the fit on high-passed residuals so the slow unmeasured disturbances drop out. I estimate the noise level and its correlation from second differences of PV. Then I search Kp, Ti and the dead-band on the fitted model and judge each candidate the way the verifier does: several noise seeds, gain and delay variants, how often it oscillates, disturbance error, offset and how much the controller output moves. I pick the lowest-error tuning from the middle of the workable region, so a small identification error does not push it over a limit. A simpler route also passes: read the stick band from the limit-cycle amplitude, set the dead-band to the larger of 0.4 times that and three noise standard deviations, and cut the old gain in half and stretch its reset time."
verification_explanation = "The verifier reads /app/controller.json, rejects a missing file or non-finite or out-of-range values, and simulates the settings on a hidden true plant and on gain- and dead-time-perturbed versions over 25 held-out runs whose noise seeds the agent never saw. The reward is 1 only if all four checks pass. The fraction of runs with a sustained oscillation must be at most 0.25. Steady-state offset must be at most 0.9 times the stick band in PV units. Disturbance error must be at most 0.75 times that of a loop that never acts. Controller-output travel must be at most 6 times the least travel of any clearly good tuning, found by a brute-force grid on the true plant. The ground truth is the simulated physics of the hidden plant from the disclosed generator, so nothing is compared with a reference answer, and the travel yardstick does not depend on any solver. The simulation is fixed-step with fixed seeds and pinned numpy, so results repeat exactly. The README has the calibration on 32 regenerated plants and the ablation table. On the real harness the oracle scores 1 and the nop scores 0."

[verifier]
timeout_sec = 600.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[agent]
timeout_sec = 14400.0

